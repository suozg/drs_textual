
name: Build Windows + Debian 12 + macOS

on:
  workflow_dispatch:

jobs:
  # ---------------- WINDOWS ----------------
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install textual sqlcipher3-wheels python-docx requests pyperclip pyinstaller

      - name: Clean previous builds
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path build) { Remove-Item -Recurse -Force build }

      - name: Build application
        run: |
          pyinstaller --clean --noconfirm --onefile --name drs_textual --collect-submodules textual --hidden-import=pyperclip --add-data "styles.tcss;." main_frame.py

      - uses: actions/upload-artifact@v4
        with:
          name: drs_textual-windows
          path: dist/drs_textual.exe
          if-no-files-found: error


  # ---------------- DEBIAN 12 ----------------
  build-debian:
    runs-on: ubuntu-latest

    container:
      image: debian:12

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3 \
            python3-venv \
            python3-dev \
            build-essential \
            libsqlcipher-dev \
            xclip \
            xsel

      - name: Setup venv and install dependencies
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install textual sqlcipher3-wheels python-docx requests pyperclip pyinstaller

      - name: Clean previous builds
        run: |
          rm -rf build dist

      - name: Build application
        run: |
          . venv/bin/activate
          pyinstaller --clean --noconfirm --onefile --name drs_textual.bin --collect-submodules textual --hidden-import=pyperclip --add-data "styles.tcss:." main_frame.py

      - uses: actions/upload-artifact@v4
        with:
          name: drs_textual-debian12
          path: dist/drs_textual.bin
          if-no-files-found: error


  # ---------------- macOS ----------------
  build-macos:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          python --version
          python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install textual sqlcipher3-wheels python-docx requests pyperclip pyinstaller

      - name: Clean previous builds
        run: |
          rm -rf build dist
          mkdir -p dist

      - name: Build application
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name drs_textual-macos-${{ matrix.arch }} \
            --collect-submodules textual \
            --hidden-import=pyperclip \
            --add-data "styles.tcss:." \
            main_frame.py

      - name: Test executable
        run: |
          test -x "dist/drs_textual-macos-${{ matrix.arch }}"
          file "dist/drs_textual-macos-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: drs_textual-macos-${{ matrix.arch }}
          path: dist/drs_textual-macos-${{ matrix.arch }}
          if-no-files-found: error
